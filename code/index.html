class BaseChord {
	constructor(string) {
		let i = 0;
		console.log( string );
		console.log( string.codePointAt(i) );
		let nextCode = string.codePointAt(i);
		if( nextCode >= 0x266D && nextCode <= 0x266F ) {
			this.accidental = string.charCodeAt(i); // Initialize accidental if exists
			i++;
			nextCode = string.charCodeAt(i);
		}
		else {
			this.accidental = null;
		}

		if( (nextCode >= 0x2160 && nextCode <= 0x2166) ||
			(nextCode >= 0x2170 && nextCode <= 0x2176) ) {
				this.numeral = string.charCodeAt(i);
				i++;
			}
		else {
			this.numeral = null;
		}

		// if is ':' then suffix indicate start modulation, otherwise if exists is the extension[s] of the chord
		if( string.length > i ) {
			this.suffix = string.substring(i);
		}
		else {
			this.suffix = null;
		}
	}
  }

const isAsciiCapital = (char) => {
  const code = char.codePointAt(0);
  return code >= 65 && code <= 90;
};

	// a cell could contain either an upper component only (which would be in center if just a chord or on top if section name),
	// or a lower component only (e.g. if just a modulation new key indicator:), or both an upper and lower component
class Cell {
  constructor(string) {
	this.upperComponent = null;
	this.lowerComponent = null;

	if(string.length == 0) {
		return;	// nothing in this cell
	}

	if( isAsciiCapital(string[0]) ) { // plain ascii for first character indicates is section name
		this.upperComponent = new SectionName(string.split(" ")[0]);
		string = string.split(" ")[1]; // for rest of decoding, only focus on stuff after the section name
		if( string == null ) {
			return; // no more string to do
		}
	}

	if( string[string.length - 1] == ":" ) { // colon indicates modulation
		this.lowerComponent = new BaseChord(string);
		return;
	}

	this.upperComponent = new BaseChord(string);

	for( let i = 0; i< string.length; i++ ) {
		console.log( string.codePointAt(i) );
	}
  }
}
